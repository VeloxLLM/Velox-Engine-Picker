[package]
name = "velox-engine-picker"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Velox"]
description = "Velox Engine Picker — 一键检测本机硬件配置，智能为 LLM 推荐最佳推理引擎"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VeloxLLM/Velox-Engine-Picker"
homepage = "https://github.com/VeloxLLM/Velox-Engine-Picker"
readme = "README.md"
keywords = ["llm", "inference", "openvino", "cuda", "hardware"]
categories = ["gui", "utilities"]

# 版本分层：v3 包含 v2 包含 v1（递进式包含）
[features]
default = ["v1"]
v1 = []
v2 = ["v1"]
v3 = ["v2"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
wgpu = "0.19"
pollster = "0.3"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "velox_engine_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true