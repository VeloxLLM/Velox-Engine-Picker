[package]
name = "velox-engine-picker"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
authors = ["Velox"]
description = "Inspect local hardware and recommend compatible LLM inference engines"
license = "MIT"
repository = "https://github.com/VeloxLLM/Velox-Engine-Picker"
homepage = "https://github.com/VeloxLLM/Velox-Engine-Picker"
readme = "README.md"
keywords = ["llm", "inference", "openvino", "cuda", "hardware"]
categories = ["gui", "utilities"]

# Feature tiers are cumulative: v3 includes v2, and v2 includes v1.
[features]
default = ["v1"]
v1 = []
v2 = ["v1"]
v3 = ["v2"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
wgpu = "0.19"
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "velox_engine_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
