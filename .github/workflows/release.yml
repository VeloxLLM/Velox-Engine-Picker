name: Release Windows prerelease

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features v1
      - run: npm run tauri build -- --features v1
      - name: Generate SHA-256 manifest
        shell: powershell
        run: |
          $bundle = Resolve-Path "src-tauri\target\release\bundle"
          Get-ChildItem $bundle -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($bundle.Path.Length + 1).Replace("\", "/")
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          } | Set-Content (Join-Path $bundle "SHA256SUMS.txt") -Encoding ASCII
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/SHA256SUMS.txt
