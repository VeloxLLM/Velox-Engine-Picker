name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装 npm 依赖
        run: npm ci

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy 检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust 测试 (v1)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features v1 --no-default-features

      - name: Rust 测试 (v2)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features v2 --no-default-features

      - name: Rust 测试 (v3)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features v3 --no-default-features

      - name: 构建前端
        run: npm run build